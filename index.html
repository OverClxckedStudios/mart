<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mart Gallery</title>
  <style>
    :root {
      --bg-color: #0d0e12;
      --card-bg: #16181f;
      --card-border: #262933;
      --accent-color: #6366f1;
      --accent-hover: #4f46e5;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --badge-vouched: #10b981;
      --badge-unvouched: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header Navigation */
    header {
      background-color: rgba(22, 24, 31, 0.85);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--card-border);
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--text-main);
    }

    .nav-tabs {
      display: flex;
      background: #090a0d;
      padding: 4px;
      border-radius: 10px;
      gap: 4px;
      border: 1px solid var(--card-border);
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 8px 18px;
      font-size: 0.875rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background: var(--accent-color);
      color: #fff;
    }

    .tab-btn:hover:not(.active) {
      color: var(--text-main);
    }

    /* Main Container */
    main {
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
      padding: 32px 24px;
      flex: 1;
    }

    #status {
      text-align: center;
      padding: 48px;
      color: var(--text-muted);
      font-size: 1rem;
    }

    /* Gallery Grid */
    #gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
    }

    /* Card Layout */
    .art-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .art-card:hover {
      transform: translateY(-4px);
      border-color: #3f4454;
      box-shadow: 0 12px 24px -10px rgba(0, 0, 0, 0.6);
    }

    .img-wrapper {
      width: 100%;
      height: 220px;
      background: #050507;
      position: relative;
    }

    .img-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .badge {
      position: absolute;
      top: 12px;
      right: 12px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .badge-vouched {
      background: var(--badge-vouched);
      color: #000;
    }

    .badge-unvouched {
      background: var(--badge-unvouched);
      color: #000;
    }

    .card-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
    }

    .card-title {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-main);
      text-overflow: ellipsis;
      overflow: hidden;
      white-space: nowrap;
    }

    .card-preview-text {
      font-size: 0.85rem;
      color: var(--text-muted);
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      line-height: 1.4;
    }

    .click-hint {
      margin-top: auto;
      font-size: 0.75rem;
      color: var(--accent-color);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
      padding-top: 8px;
    }

    /* Modal / Popup Detail View */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-container {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      max-width: 900px;
      width: 100%;
      max-height: 90vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }

    .modal-close-btn {
      position: absolute;
      top: 16px;
      right: 16px;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      transition: background 0.2s ease;
    }

    .modal-close-btn:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .modal-content {
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    @media (min-width: 768px) {
      .modal-content {
        flex-direction: row;
      }
    }

    .modal-media {
      flex: 1.2;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 300px;
    }

    .modal-media img {
      width: 100%;
      height: 100%;
      max-height: 70vh;
      object-fit: contain;
    }

    .modal-details {
      flex: 1;
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      background: var(--card-bg);
    }

    .modal-header-tag {
      align-self: flex-start;
    }

    .modal-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .vouch-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      border-left: 4px solid var(--badge-vouched);
      padding: 16px;
      border-radius: 8px;
      font-size: 0.95rem;
      line-height: 1.6;
      color: #e5e7eb;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .vouch-box-header {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 8px;
      font-weight: 700;
    }

    .no-vouch-message {
      color: var(--text-muted);
      font-size: 0.9rem;
      font-style: italic;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">Mart Gallery</div>
    <nav class="nav-tabs">
      <button class="tab-btn active" id="tab-vouched" onclick="switchTab('vouched')">Vouched</button>
      <button class="tab-btn" id="tab-unvouched" onclick="switchTab('unvouched')">Unvouched</button>
    </nav>
  </header>

  <main>
    <div id="status">Loading...</div>
    <div id="gallery"></div>
  </main>

  <!-- Interactive Detail Overlay -->
  <div id="modal" class="modal-overlay" onclick="closeModal(event)">
    <div class="modal-container" onclick="event.stopPropagation()">
      <button class="modal-close-btn" onclick="closeModal()">&times;</button>
      <div class="modal-content">
        <div class="modal-media">
          <img id="modal-img" src="" alt="">
        </div>
        <div class="modal-details">
          <div class="modal-header-tag">
            <span id="modal-badge" class="badge"></span>
          </div>
          <h2 id="modal-title" class="modal-title"></h2>
          
          <div id="vouch-section">
            <div class="vouch-box-header">Attached Vouch Note</div>
            <div id="modal-vouch-text" class="vouch-box"></div>
          </div>
          <div id="no-vouch-section" class="no-vouch-message" style="display: none;">
            This image is currently unvouched. No note attached.
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const CONFIG = {
      username: 'OverClxckedStudios',
      repo: 'mart'
    };

    let currentTab = 'vouched';
    const cache = { vouched: [], unvouched: [] };

    // Format file name into a readable title
    function cleanTitle(filename) {
      return filename
        .replace(/\.[^/.]+$/, '')
        .replace(/[-_]/g, ' ')
        .replace(/([a-z])([A-Z])/g, '$1 $2');
    }

    // Load corresponding vouch message from /vouches folder
    async function fetchVouchText(imageName) {
      const baseName = imageName.substring(0, imageName.lastIndexOf('.'));
      const textUrl = `https://raw.githubusercontent.com/${CONFIG.username}/${CONFIG.repo}/main/vouches/${baseName}.txt`;
      
      try {
        const res = await fetch(textUrl);
        if (res.ok) return await res.text();
      } catch (e) {
        // Text file not found
      }
      return null;
    }

    async function loadCategory(category) {
      const status = document.getElementById('status');
      const gallery = document.getElementById('gallery');
      
      status.style.display = 'block';
      status.innerText = `Loading ${category} items...`;
      gallery.innerHTML = '';

      if (cache[category].length > 0) {
        renderGallery(cache[category]);
        return;
      }

      try {
        const res = await fetch(`https://api.github.com/repos/${CONFIG.username}/${CONFIG.repo}/contents/${category}`);
        if (!res.ok) throw new Error(`Could not locate /${category} folder in GitHub repository.`);

        const files = await res.json();
        const imageFiles = files.filter(f => f.type === 'file' && /\.(png|jpe?g|gif|webp|svg)$/i.test(f.name));

        if (imageFiles.length === 0) {
          status.innerText = `No items found in /${category}.`;
          return;
        }

        const items = await Promise.all(imageFiles.map(async (file) => {
          let vouchText = null;
          if (category === 'vouched') {
            vouchText = await fetchVouchText(file.name);
          }
          return {
            name: file.name,
            title: cleanTitle(file.name),
            url: file.download_url,
            vouch: vouchText
          };
        }));

        cache[category] = items;
        renderGallery(items);

      } catch (err) {
        status.innerText = err.message || "Failed to load directory items.";
      }
    }

    function renderGallery(items) {
      const status = document.getElementById('status');
      const gallery = document.getElementById('gallery');
      
      status.style.display = 'none';
      gallery.innerHTML = '';

      items.forEach(item => {
        const card = document.createElement('div');
        card.className = 'art-card';
        card.onclick = () => openModal(item);

        const isVouched = currentTab === 'vouched';
        const badgeClass = isVouched ? 'badge-vouched' : 'badge-unvouched';
        const badgeText = isVouched ? 'Vouched' : 'Unvouched';

        card.innerHTML = `
          <div class="img-wrapper">
            <img src="${item.url}" alt="${item.title}" loading="lazy">
            <span class="badge ${badgeClass}">${badgeText}</span>
          </div>
          <div class="card-body">
            <div class="card-title">${item.title}</div>
            ${item.vouch ? `<div class="card-preview-text">"${item.vouch}"</div>` : ''}
            <div class="click-hint">${isVouched ? 'Click to read vouch →' : 'Click to inspect →'}</div>
          </div>
        `;
        gallery.appendChild(card);
      });
    }

    function switchTab(tab) {
      if (currentTab === tab) return;
      currentTab = tab;

      document.getElementById('tab-vouched').classList.toggle('active', tab === 'vouched');
      document.getElementById('tab-unvouched').classList.toggle('active', tab === 'unvouched');

      loadCategory(tab);
    }

    function openModal(item) {
      const modal = document.getElementById('modal');
      const modalImg = document.getElementById('modal-img');
      const modalTitle = document.getElementById('modal-title');
      const modalBadge = document.getElementById('modal-badge');
      const modalVouchText = document.getElementById('modal-vouch-text');
      const vouchSection = document.getElementById('vouch-section');
      const noVouchSection = document.getElementById('no-vouch-section');

      modalImg.src = item.url;
      modalTitle.innerText = item.title;

      if (currentTab === 'vouched') {
        modalBadge.className = 'badge badge-vouched';
        modalBadge.innerText = 'Vouched';
      } else {
        modalBadge.className = 'badge badge-unvouched';
        modalBadge.innerText = 'Unvouched';
      }

      if (item.vouch) {
        modalVouchText.innerText = item.vouch;
        vouchSection.style.display = 'block';
        noVouchSection.style.display = 'none';
      } else {
        vouchSection.style.display = 'none';
        noVouchSection.style.display = 'block';
      }

      modal.classList.add('open');
    }

    function closeModal(event) {
      if (!event || event.target.classList.contains('modal-overlay') || event.target.classList.contains('modal-close-btn')) {
        document.getElementById('modal').classList.remove('open');
      }
    }

    // Load Vouched tab by default on launch
    loadCategory('vouched');
  </script>
</body>
</html>
