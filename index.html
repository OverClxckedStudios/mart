<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #111; min-height: 100vh; }
    
    /* Image Grid - Preserves full image aspect ratios */
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
      padding: 20px;
      align-items: start;
    }
    .gallery img {
      width: 100%;
      height: auto;          /* Prevents cropping / stretching */
      max-height: 90vh;     /* Keeps huge images within frame */
      object-fit: contain;  /* Displays full image cleanly */
      border-radius: 4px;
      display: block;
    }
  </style>
</head>
<body>

  <div class="gallery" id="gallery"></div>

  <script>
    // List your local image filenames here (stored in the same directory/folder)
    const images = [
      'art1.jpg',
      'art2.png',
      'art3.webp'
    ];

    const gallery = document.getElementById('gallery');

    // Automatically load all images from the folder
    images.forEach(filename => {
      const img = document.createElement('img');
      img.src = `./${filename}`;
      gallery.appendChild(img);
    });
  </script>
</body>
</html>
