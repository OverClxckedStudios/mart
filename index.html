<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #111; min-height: 100vh; }

    /* Responsive Grid displaying FULL, UNCROPPED images */
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
      padding: 20px;
      align-items: start;
    }
    
    .gallery img {
      width: 100%;
      height: auto;
      max-height: 90vh;
      object-fit: contain; /* Ensures 100% full image visibility without cropping */
      border-radius: 4px;
      display: block;
    }
  </style>
</head>
<body>

  <div class="gallery" id="gallery"></div>

  <script>
    // Write your exact image filenames here:
    const images = [
      'art1.jpg',
      'art2.png',
      'art3.webp'
    ];

    const gallery = document.getElementById('gallery');

    // Dynamically builds the full-size images from the root folder
    images.forEach(filename => {
      const img = document.createElement('img');
      img.src = `./${filename}`;
      gallery.appendChild(img);
    });
  </script>
</body>
</html>
