<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mart</title>
  <style>
    body {
      margin: 0;
      background: #111;
      color: #fff;
      font-family: system-ui, sans-serif;
    }
    #gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
      padding: 16px;
    }
    .art-item img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: contain;
    }
    #status {
      padding: 20px;
      color: #ff6b6b;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div id="status">Loading...</div>
  <div id="gallery"></div>

  <script>
    async function loadArt() {
      const status = document.getElementById('status');
      const gallery = document.getElementById('gallery');

      const username = 'OverClxckedStudios';
      const repo = 'mart';
      
      // Check both lowercase and uppercase folder names
      const folderCandidates = ['images', 'Images', 'mart/images', 'mart/Images'];

      for (const folderPath of folderCandidates) {
        try {
          const res = await fetch(`https://api.github.com/repos/${username}/${repo}/contents/${folderPath}`);
          
          if (res.ok) {
            const files = await res.json();
            status.style.display = 'none';

            let imageCount = 0;
            files.forEach(file => {
              if (file.type === 'file' && /\.(png|jpe?g|gif|webp|svg)$/i.test(file.name)) {
                const div = document.createElement('div');
                div.className = 'art-item';
                const img = document.createElement('img');
                img.src = file.download_url;
                img.alt = file.name;
                div.appendChild(img);
                gallery.appendChild(div);
                imageCount++;
              }
            });

            if (imageCount > 0) return; // Found images, exit function
          }
        } catch (e) {
          // Continue to next path candidate
        }
      }

      status.innerText = "Error 404: GitHub cannot find the folder. Ensure your images are inside a folder named 'images' directly in the root of the repo.";
    }

    loadArt();
  </script>
</body>
</html>
