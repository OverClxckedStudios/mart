<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mart</title>
  <style>
    body {
      margin: 0;
      background: #111;
      color: #fff;
      font-family: system-ui, sans-serif;
    }
    #gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
      padding: 16px;
    }
    .art-item img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: contain;
    }
    #status {
      padding: 20px;
      color: #ff6b6b;
    }
  </style>
</head>
<body>
  <div id="status">Loading...</div>
  <div id="gallery"></div>

  <script>
    async function loadArt() {
      const status = document.getElementById('status');
      const gallery = document.getElementById('gallery');

      // Extract username and repo directly from GitHub Pages URL
      const pathSegments = window.location.pathname.split('/').filter(Boolean);
      const username = window.location.hostname.split('.')[0];
      const repo = pathSegments[0] || 'mart';
      const folderPath = 'images';

      try {
        const res = await fetch(`https://api.github.com/repos/${username}/${repo}/contents/${folderPath}`);
        
        if (!res.ok) {
          throw new Error(`GitHub API returned status ${res.status}. Check if the repo '${repo}' is public and contains an '${folderPath}' folder.`);
        }

        const files = await res.json();
        status.style.display = 'none';

        let imageCount = 0;
        files.forEach(file => {
          if (file.type === 'file' && /\.(png|jpe?g|gif|webp|svg)$/i.test(file.name)) {
            const div = document.createElement('div');
            div.className = 'art-item';
            const img = document.createElement('img');
            img.src = file.download_url;
            img.alt = file.name;
            div.appendChild(img);
            gallery.appendChild(div);
            imageCount++;
          }
        });

        if (imageCount === 0) {
          status.style.display = 'block';
          status.innerText = "No image files found in the 'images' folder.";
        }
      } catch (err) {
        status.innerText = `Error loading images: ${err.message}`;
      }
    }

    loadArt();
  </script>
</body>
</html>
