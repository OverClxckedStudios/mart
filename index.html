<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyWork Image Viewer</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }

        .controls {
            margin-bottom: 20px;
            text-align: center;
        }

        .file-label {
            background-color: #2563eb;
            color: white;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            display: inline-block;
        }

        .file-label:hover {
            background-color: #1d4ed8;
        }

        input[type="file"] {
            display: none;
        }

        #gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 16px;
        }

        .image-container {
            background-color: #1e1e1e;
            border-radius: 8px;
            padding: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 300px; /* Fixed container height */
            overflow: hidden;
            border: 1px solid #333;
        }

        .image-container img {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain; /* Fits image fully without cropping */
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="controls">
        <label for="folderInput" class="file-label">Select /MyWork Folder</label>
        <input type="file" id="folderInput" webkitdirectory directory multiple>
    </div>

    <div id="gallery"></div>

    <script>
        const folderInput = document.getElementById('folderInput');
        const gallery = document.getElementById('gallery');

        folderInput.addEventListener('change', (event) => {
            const files = event.target.files;
            gallery.innerHTML = ''; // Clear existing gallery

            for (let i = 0; i < files.length; i++) {
                const file = files[i];

                // Check if the file is an image
                if (file.type.startsWith('image/')) {
                    const reader = new FileReader();

                    reader.onload = function(e) {
                        const container = document.createElement('div');
                        container.className = 'image-container';

                        const img = document.createElement('img');
                        img.src = e.target.result;
                        img.alt = file.name;

                        container.appendChild(img);
                        gallery.appendChild(container);
                    };

                    reader.readAsDataURL(file);
                }
            }
        });
    </script>
</body>
</html>
