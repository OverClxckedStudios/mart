<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mart</title>
  <style>
    body {
      margin: 0;
      background: #111;
      color: #fff;
      font-family: system-ui, sans-serif;
    }
    #gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
      padding: 16px;
    }
    .art-item img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <div id="gallery"></div>

  <script>
    const USERNAME = 'YOUR_GITHUB_USERNAME'; // Replace with your GitHub username
    const REPO = 'mart';
    const FOLDER_PATH = 'images';

    async function loadArt() {
      const gallery = document.getElementById('gallery');
      try {
        const res = await fetch(`https://api.github.com/repos/${USERNAME}/${REPO}/contents/${FOLDER_PATH}`);
        const files = await res.json();

        files.forEach(file => {
          if (file.type === 'file' && /\.(png|jpe?g|gif|webp|svg)$/i.test(file.name)) {
            const div = document.createElement('div');
            div.className = 'art-item';
            const img = document.createElement('img');
            img.src = file.download_url;
            img.alt = file.name;
            div.appendChild(img);
            gallery.appendChild(div);
          }
        });
      } catch (err) {
        console.error('Error fetching images:', err);
      }
    }

    loadArt();
  </script>
</body>
</html>
